document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ion lsGet(k) {\n    try { var r = localStorage.getItem(LS + k); if (!r) return null; var o = JSON.parse(r); if (!o || Date.now() - o.t > TTL) return null; return o.d; } catch (e) { return null; }\n  }\n  function lsSet(k, d) { try { localStorage.setItem(LS + k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) { } }\n  async function getJson(url, opts) { var r = await fetch(url, opts); if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }\n  async function getJsonRetry(url, opts, n) {\n    n = n || 3;\n    for (var i = 0; i < n; i++) { try { return await getJson(url, opts); } catch (e) { if (i === n - 1) throw e; await new Promise(function (s) { setTimeout(s, 500 * (i + 1)); }); } }\n  }\n  function chartOf(o) { return (o.totalDataChart || []).map(function (p) { return [p[0], p[1] || 0]; }); }\n\n  /* ---------- Dune (live, browser-side, cached 24h) ---------- */\n  function duneKey() { return window.__AERO_DUNE && window.__AERO_DUNE.duneApiKey; }\n  function dstamp(s) { return Math.floor(Date.parse(String(s).slice(0, 10)) / 1000 / DAY) * DAY; }\n  function toSeries(by) { return Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).map(function (d) { return [d, by[d]]; }); }\n  var duneMem = {};\n  function duneRows(id) {\n    if (duneMem[id]) return duneMem[id];\n    var ck = 'dune_' + id, c = lsGet(ck);\n    if (c) { duneMem[id] = Promise.resolve(c); return duneMem[id]; }\n    duneMem[id] = (async function () {\n      var r = await fetch('https://api.dune.com/api/v1/query/' + id + '/results?limit=20000', { headers: { 'X-Dune-API-Key': duneKey() } });\n      if (!r.ok) throw new Error('dune ' + id + ' HTTP ' + r.status);\n      var j = await r.json();\n      var rows = (j.result && j.result.rows) || [];\n      lsSet(ck, rows);\n      return rows;\n    })();\n    duneMem[id].catch(function () { delete duneMem[id]; });\n    return duneMem[id];\n  }\n  function cfgArr(k) { var d = window.__AERO_DUNE; return d && Array.isArray(d[k]) ? d[k] : []; }\n  function bigDiv(hex) { try { return Number(BigInt(hex)) / E18; } catch (e) { return null; } }\n\n  var OUTLIERS = { 1757548800: 1 };\n  function scrubOutliers(series) {\n    return series.map(function (p, i) {\n      if (!OUTLIERS[p[0]]) return p;\n      var prev = i > 0 ? series[i - 1][1] : null, next = i < series.length - 1 ? series[i + 1][1] : null;\n      return [p[0], prev != null && next != null ? (prev + next) / 2 : (prev != null ? prev : (next != null ? next : 0))];\n    });\n  }\n  function stepFn(series) {\n    var s = series.slice().sort(function (a, b) { return a[0] - b[0]; });\n    var keys = s.map(function (p) { return p[0]; });\n    return function (t) { var best = null; for (var i = 0; i < keys.length; i++) { if (keys[i] <= t) best = s[i][1]; else break; } return best == null && s.length ? s[0][1] : best; };\n  }\n  function densify(series) {\n    if (!series.length) return [];\n    var s = series.slice().sort(function (a, b) { return a[0] - b[0]; });\n    var f = stepFn(s), out = [], t0 = Math.floor(s[0][0] / DAY) * DAY, t1 = Math.floor(s[s.length - 1][0] / DAY) * DAY;\n    for (var t = t0; t <= t1; t += DAY) out.push([t, f(t)]);\n    return out;\n  }\n\n  /* ---------- DeFiLlama (volume / fees / revenue / TVL) ---------- */\n  var queue = Promise.resolve();\n  function enqueue(fn) { var p = queue.then(fn); queue = p.catch(function () { }); return p; }\n  async function dexOnlySum(url) {\n    var o = await getJson(url);\n    var isDex = {}; (o.protocols || []).forEach(function (p) { if (p.category === 'Dexs') isDex[p.name] = 1; });\n    var out = [], bd = o.totalDataChartBreakdown || [];\n    for (var i = 0; i < bd.length; i++) { var ts = bd[i][0], m = bd[i][1]; if (ts < 1651363200) continue; var s = 0; for (var k in m) { if (isDex[k]) s += m[k] || 0; } out.push([ts, Math.round(s)]); }\n    return out;\n  }\n  function heavy(key, url) { var c = lsGet(key); if (c) return Promise.resolve(c); return enqueue(function () { return dexOnlySum( --ink);border-color:var(--acc)}\n.dlbtn svg{display:block}\n.dlbtn[disabled]{cursor:default;color:var(--mut)}\n.dlspin{width:12px;height:12px;border-radius:50%;border:2px solid var(--brd);border-top-color:var(--acc);animation:dlspin .7s linear infinite}\n@keyframes dlspin{to{transform:rotate(360deg)}}\n.kpi .dlbtn{bottom:8px;right:8px;height:22px;padding:0 7px;font-size:10px}\n@media(max-width:960px){.dlbtn{opacity:1;transform:none}}\n.lbadge{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.08em;padding:1px 6px;border-radius:4px;border:1px solid currentColor;white-space:nowrap;flex-shrink:0}\n.lbadge.live{color:#3dbb6d}\n.lbadge.model,.lbadge.mixed{color:#d9902b}\n.lbadge.ph{color:var(--mut);border-style:dashed}\n.gap8{gap:8px}\n.gap4{gap:4px}\n.skel{border-radius:8px;background:var(--ph);animation:pulse 1.4s ease-in-out infinite;display:flex;align-items:center;justify-content:center}\n.phbox{position:relative;border:1px dashed var(--brd);border-radius:8px;overflow:hidden}\n.phstripe{background:repeating-linear-gradient(45deg,var(--ph) 0 4px,transparent 4px 12px)}\n.phlabel{position:relative;font-size:11px;color:var(--mut);background:var(--card);padding:4px 10px;border-radius:6px;text-align:center;max-width:80%}\n.tip{position:absolute;top:8px;background:var(--tipbg);border:1px solid var(--brd);border-radius:6px;padding:6px 9px;pointer-events:none;z-index:2}\n.tipd{font-size:10px;color:var(--mut)}\n.tipv{font-size:13px;font-weight:600;margin-top:2px}\n.axtxt{fill:var(--mut);font-family:'IBM Plex Mono',monospace;font-size:10px}\n.prow{display:flex;align-items:center;gap:12px;padding:7px 8px;border-bottom:1px solid var(--grid);font-size:13px}\n.phead{font-size:10px;color:var(--mut);letter-spacing:.08em;border-bottom:1px solid var(--brd)}\n.pc-rank{width:22px;color:var(--mut);font-size:11px}\n.pc-num{width:108px;text-align:right;font-size:12px}\n.ptvlbar{position:absolute;left:-4px;top:-4px;bottom:-4px;background:var(--acc);opacity:.09;border-radius: ground:rgba(255,255,255,.09);padding:3px;border-radius:9px}\n.schip{flex:1;background:transparent;border:none;color:rgba(255,255,255,.7);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:5px 4px;border-radius:6px;cursor:pointer;transition:background .12s,color .12s}\n.schip.on{background:#fff;color:var(--sidebg);font-weight:600}\n.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}\n.slive{display:flex;align-items:center;gap:7px;font-size:11px;color:rgba(255,255,255,.6)}\n.sdot{width:7px;height:7px;border-radius:50%;background:#55e08a;animation:pulse 2.4s infinite}\n.smm{width:100%;max-width:160px;height:24px;background:rgba(255,255,255,.78);-webkit-mask:url(\"b3a57ac2-0168-464d-b07b-86cd4f75faab\") left center/contain no-repeat;mask:url(\"b3a57ac2-0168-464d-b07b-86cd4f75faab\") left center/contain no-repeat}\n.sby{font-size:11px;color:rgba(255,255,255,.42);line-height:1.5}\n.main{flex:1;margin-left:248px;padding:34px 38px 60px;min-width:0}\n.sec{display:flex;flex-direction:column;gap:20px;max-width:1240px;margin:0 auto}\n.sechead{display:flex;flex-direction:column;gap:8px;margin-bottom:2px}\n.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:600}\n.sectitle{margin:0;font-family:var(--fhead);font-size:30px;font-weight:700;letter-spacing:-.015em;max-width:820px}\n.secsub{margin:0;font-size:14.5px;color:var(--mut);max-width:860px;line-height:1.6;text-wrap:pretty}\n.kpis{grid-template-columns:repeat(4,1fr);gap:14px;margin-top:0}\n.kpi.card{padding:16px 18px;border-radius:var(--radsm)}\n.klab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}\n.kval{font-family:'IBM Plex Mono',monospace;font-size:19px;font-weight:600;margin-top:5px;color:var(--ink)}\n.grid2{gap:18px;margin-top:0}\n.card{border-radius:var(--radlg);padding:22px 24px}\n.chtitle{font-family:var(--fhead);font-size:15.5px;font-weight:600}\n.chsub{font-size:12.5px;color:var(--mut);margin-top:3px}\n.chnote{margin-right:90px}\n.title{font-family:var(--fhead)}\n.gbtn{border-radius:7px}\n.foot{max-width:1240px}\n.thm-mm .snavb.on{background:rgba(184,127,53,.16);color:#f3ece3}\n.thm-mm .schip.on{background:#b87f35;color:#130b07}\n.thm-mm .sbadge{color:#130b07}@media(max-width:1080px){.side{width:212px}.main{margin-left:212px;padding:28px 24px 52px}.sectitle{font-size:26px}}\n@media(max-width:820px){.root{flex-direction:column}.side{position:static;width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;height:auto;gap:12px 18px;padding:16px 20px}.sbrand{flex:0 0 auto}.snav{flex-direction:row;flex-wrap:wrap;flex:1}.sfmt{margin-left:auto}.sfoot{display:none}.main{margin-left:0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"root {{ themeClass }}\">\n<aside class=\"side\">\n<div class=\"sbrand\"><div class=\"sbadge\"><span class=\"sbadgeA\">A<\u002Fspan><\u002Fdiv><div><div class=\"sbtitle\">Aerodrome Finance<\u002Fdiv><div class=\"sbsub\">Research dashboard<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<nav class=\"snav\"><sc-for list=\"{{ navs }}\" as=\"n\" hint-placeholder-count=\"5\"><button class=\"snavb pointer {{ n.cls }}\" sc-camel-on-click=\"{{ n.go }}\"><span class=\"snum\">{{ n.num }}<\u002Fspan><span>{{ n.label }}<\u002Fspan><\u002Fbutton><\u002Fsc-for><\u002Fnav>\n<div class=\"sfmt\"><span class=\"sfmtlab\">Format<\u002Fspan><div class=\"sfmtrow\"><sc-for list=\"{{ themes }}\" as=\"t\" hint-placeholder-count=\"4\"><button class=\"schip pointer {{ t.cls }}\" sc-camel-on-click=\"{{ t.go }}\">{{ t.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Fdiv>\n<div class=\"sfoot\"><div class=\"slive\"><span class=\"sdot\"><\u002Fspan>Live · DeFiLlama · Base · Dune<\u002Fdiv><div class=\"smm\" role=\"img\" aria-label=\"Machines &amp; Money\"><\u002Fdiv><div class=\"sby\">Prepared by Machines &amp; Money<br>July 2026<\u002Fdiv><\u002Fdiv>\n<\u002Faside>\n<main class=\"main\">\n<section class=\"sec\" data-screen-label=\"{{ pageLabel }}\">\n<header class=\"sechead\"><div class=\"eyebrow mono\">{{ pageNum }} · {{ pageLabel }}<\u002Fdiv><h1 class=\"m0 sectitle\">{{ pageTitle }}<\u002Fh1><p class=\"secsub\">{{ pageSub }}<\u002Fp><\u002Fheader>\n<div class=\"kpis\"><sc-for list=\"{{ cards }}\" as=\"k\" hint-placeholder-count=\"4\"><div class=\"cardwrap\"><div class=\"kpi card\"><div class=\"klab\">{{ k.label }}<\u002Fdiv><div class=\"kval\">{{ k.value }}<\u002Fdiv><\u002Fdiv><button type=\"button\" class=\"dlbtn no-capture kpidl pointer\" data-title=\"{{ k.label }}\" title=\"Download PNG\">PNG<\u002Fbutton><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<div class=\"grid2\"><sc-for list=\"{{ blocks }}\" as=\"b\" hint-placeholder-count=\"4\"><div class=\"{{ b.cls }}\"><x-import component-from-global-scope=\"AeroBlock\" dc-props=\"{{ b }}\" hint-size=\"100%,360px\"><\u002Fx-import><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n<footer class=\"foot mono\">Drag horizontally on any chart to zoom; double-click (or ⟲) resets. “→” metrics read on the right axis. Each chart is tagged LIVE, LIVE+MODEL or NO FEED with its source. Market data: DeFiLlama dimensions API (volume, fees, revenue, holders revenue, bribes, TVL), coins.llama.fi (AERO price), yields.llama.fi (pools), TradingView (price chart); “DEX spot” totals sum all DeFiLlama-categorized Dexs and DeFi-wide denominators are cached 24h. Onchain data (Base): AERO weekly emissions &amp; total supply decoded from the Aerodrome Minter’s emission events (base.blockscout.com logs); total locked veAERO from VotingEscrow.supply() sampled ~monthly via archival eth_call (mainnet.base.org); lock rate = locked ÷ total supply; circulating = total − locked; FDV/market cap = AERO price × total/circulating supply; holder counts and top-10 holder lists from the Blockscout token API. Derived: voter income = holders revenue + bribes; voting APY = income ÷ (locked × price), annualized. No public feed (placeholders): AERO buybacks, spot FX &amp; BTC/USD pair volume, historical holder counts, and lock-duration cohorts — these need a Dune/indexer query. Note: the supplied Basescan key uses Etherscan’s V2 API, whose free tier does not cover Base, so onchain data is served via Blockscout + the Base public RPC instead.<\u002Ffooter>\n<\u002Fsection><\u002Fmain><\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mm&quot;,&quot;dark&quot;,&quot;light&quot;,&quot;aero&quot;],&quot;default&quot;:&quot;mm&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;defaultGran&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;D&quot;,&quot;W&quot;,&quot;M&quot;],&quot;default&quot;:&quot;D&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Charts&quot;}}\">\nclass Component extends DCLogic {\n  state = { page: 'landing', theme: null, kpiVals: {} };\n  componentDidMount() {\n    this._alive = true; this._wait();\n    if (!this._dlBound) {\n      this._dlBound = (e) => {\n        const b = e.target.closest && e.target.closest('.kpidl');\n        if (!b) return;\n        const card = b.parentElement.querySelector('.card');\n        if (card && window.AeroExport) {\n          b.classList.add('show');\n          window.AeroExport.download(card, { title: b.getAttribute('data-title'), project: 'Aerodrome Finance Dashboard' })\n            .catch(() => {}).then(() => b.classList.remove('show'));\n        }\n      };\n      document.addEventListener('click', this._dlBound);\n    }\n  }\n  componentWillUnmount() { this._alive = false; clearTimeout(this._t); if (this._dlBound) document.removeEventListener('click', this._dlBound); }\n  _wait() {\n    if (!this._alive) return;\n    if (!window.AeroData) { this._t = setTimeout(() => this._wait(), 150); return; }\n    this._loadKpis(this.state.page);\n  }\n  _usd(v) {\n    const a = Math.abs(v);\n    if (a >= 1e9) return '$' + (a / 1e9).toFixed(2) + 'B';\n    if (a >= 1e6) return '$' + (a / 1e6).toFixed(1) + 'M';\n    if (a >= 1e3) return '$' + (a / 1e3).toFixed(0) + 'K';\n    return '$' + a.toFixed(2);\n  }\n  _aero(v) {\n    const a = Math.abs(v);\n    if (a >= 1e9) return (a / 1e9).toFixed(2) + 'B';\n    if (a >= 1e6) return (a / 1e6).toFixed(1) + 'M';\n    return Math.round(a).toLocaleString();\n  }\n  _pct(v) { return (v * 100).toFixed(1) + '%'; }\n  _kpiSpecs(page) {\n    const sum30 = s => s.slice(-30).reduce((a, p) => a + p[1], 0);\n    const last = s => (s.length ? s[s.length - 1][1] : 0);\n    const marketCards = [\n      { label: '30-Day Spot Volume', deps: ['aeroVol'], calc: v => this._usd(sum30(v)) },\n      { label: 'Share of Base Spot Volume · 30d', deps: ['aeroVol', 'baseVol'], calc: (v, b) => this._pct(sum30(v) / sum30(b)) },\n      { label: 'Share of DeFi Spot Volume · 30d', deps: ['aeroVol', 'defiVol'], calc: (v, d) => this._pct(sum30(v) / sum30(d)) },\n      { label: 'Volume / TVL · 24h', deps: ['aeroVol', 'aeroTVL'], calc: (v, t) => (last(v) / last(t)).toFixed(2) + 'x' }\n    ];\n    const specs = {\n      landing: marketCards,\n      dex: marketCards,\n      aero: [\n        { label: 'AERO Price', deps: ['aeroPrice'], calc: p => '$' + last(p).toFixed(3) },\n        { label: 'Circulating Supply', deps: ['circSupply'], calc: c => this._aero(last(c)) + ' AERO' },\n        { label: 'Total Supply', deps: ['totalSupply'], calc: t => this._aero(last(t)) + ' AERO' },\n        { label: 'AERO Holders', deps: ['aeroHolders'], calc: h => h && h.count ? h.count.toLocaleString() : 'n/a' }\n      ],\n      ve: [\n        { label: 'Total Locked veAERO', deps: ['lockedAero'], calc: l => this._aero(last(l)) + ' AERO' },\n        { label: 'veAERO Lock Rate', deps: ['lockRate'], calc: r => this._pct(last(r)) },\n        { label: 'Avg Lock Duration', deps: ['veSnapshot'], calc: s => { const a = s && (s.avg_lock_years != null ? s.avg_lock_years : s.avgLockYears); return a != null ? a.toFixed(2) + ' yrs' : 'n/a'; } },\n        { label: 'veAERO Holders', deps: ['veSnapshot'], calc: s => { const h = s && (s.holders != null ? s.holders : s.holder_count); return h != null ? Number(h).toLocaleString() : 'n/a'; } }\n      ],\n      fin: [\n        { label: 'Share of Base DEX Fees · 30d', deps: ['aeroFees', 'baseFeesDex'], calc: (a, b) => this._pct(sum30(a) / sum30(b)) },\n        { label: 'Share of DeFi DEX Fees · 30d', deps: ['aeroFees', 'defiFeesDex'], calc: (a, b) => this._pct(sum30(a) / sum30(b)) },\n        { label: 'Share of Base Holders Rev · 30d', deps: ['aeroHold', 'baseHoldDex'], calc: (a, b) => this._pct(sum30(a) / sum30(b)) },\n        { label: 'Share of DeFi Holders Rev · 30d', deps: ['aeroHold', 'defiHoldDex'], calc: (a, b) => this._pct(sum30(a) / sum30(b)) }\n      ]\n    };\n    return specs[page];\n  }\n  _loadKpis(page) {\n    if (!window.AeroData) return;\n    this._kpiSpecs(page).forEach((sp, i) => {\n      const id = page + ':' + i;\n      if (this.state.kpiVals[id] != null) return;\n      Promise.all(sp.deps.map(k => window.AeroData.get(k)))\n        .then(rs => { if (this._alive) this.setState(s => ({ kpiVals: Object.assign({}, s.kpiVals, { [id]: sp.calc(...rs) }) })); })\n        .catch(() => { if (this._alive) this.setState(s => ({ kpiVals: Object.assign({}, s.kpiVals, { [id]: 'n/a' }) })); });\n    });\n  }\n  _pages() {\n    const gran = this.props.defaultGran ?? 'D';\n    const usdAero = [{ key: 'usd', label: 'USD' }, { key: 'aero', label: 'AERO' }];\n    const shareMetrics = scope => ([\n      { key: 'vol', label: 'Volume', num: 'aeroVol', den: scope === 'base' ? 'baseVol' : 'defiVol' },\n      { key: 'fees', label: 'Fees', num: 'aeroFees', den: scope === 'base' ? 'baseFeesDex' : 'defiFeesDex' },\n      { key: 'rev', label: 'Revenue', num: 'aeroRev', den: scope === 'base' ? 'baseRevDex' : 'defiRevDex' },\n      { key: 'hold', label: 'Holders Rev', num: 'aeroHold', den: scope === 'base' ? 'baseHoldDex' : 'defiHoldDex' }\n    ]);\n    const keyMetrics = [\n      { key: 'vol', label: 'Volume', num: 'aeroVol' },\n      { key: 'fees', label: 'Fees', num: 'aeroFees' },\n      { key: 'rev', label: 'Revenue', num: 'aeroRev' },\n      { key: 'hold', label: 'Holders Rev', num: 'aeroHold' }\n    ];\n    const incentivesBlock = id => ({ id, type: 'multi', title: 'Incentives', sub: 'AERO emissions to LPs', fmt: { usd: 'usd', aero: 'aero' }, units: usdAero, metrics: [{ key: 'inc', label: 'Incentives', num: { usd: 'incentives', aero: 'emissions' } }], defaultGran: gran, note: 'onchain Minter emissions (Base) × AERO price' });\n    return {\n      landing: {\n        label: 'Home', navLabel: 'Home',\n        title: 'Aerodrome Finance Dashboard',\n        sub: \"When it comes to capital efficiency and user incentives, Aerodrome is the strongest major DEX in DeFi. LPs are rewarded with AERO tokens, while voters are rewarded with pool fees, allowing veAERO holders to choose which tokens they receive as rewards. Dromos Labs, the team behind Aerodrome, also allocates a portion of their revenue to AERO buybacks, which softens the impact of the token's overall inflation.\",\n        blocks: [\n          { id: 'l-tv', type: 'tv', cls: 'wide', dark: true },\n          { id: 'l-key', type: 'multi', title: 'Key Metrics', sub: 'Aerodrome · USD', fmt: 'usd', metrics: keyMetrics, defaultSel: ['vol'], defaultGran: gran },\n          incentivesBlock('l-inc'),\n          { id: 'l-base', type: 'multi', title: 'Market Share On Base', sub: '% of Base DEX spot totals', fmt: 'pct', heavy: true, metrics: shareMetrics('base'), defaultSel: ['vol', 'fees', 'rev', 'hold'], defaultGran: gran },\n          { id: 'l-defi', type: 'multi', title: 'Market Share Of DeFi', sub: '% of all DeFi DEX spot totals', fmt: 'pct', heavy: true, metrics: shareMetrics('defi'), defaultSel: ['vol', 'fees', 'rev', 'hold'], defaultGran: gran }\n        ]\n      },\n      dex: {\n        label: 'DEX Stats', navLabel: 'DEX Stats',\n        title: 'Dominating the Base ecosystem',\n        sub: \"Despite ongoing competition from other leading DEXs like Uniswap and PancakeSwap, Aerodrome has maintained its spot volume dominance in the Base ecosystem. It's also a primary source of activity when it comes to onchain FX trading and BTC/USD spot trading.\",\n        blocks: [\n          { id: 'd-vol', type: 'multi', title: 'Spot Volume', sub: 'Aerodrome · USD', fmt: 'usd', metrics: [{ key: 'vol', label: 'Volume', num: 'aeroVol' }], defaultGran: gran },\n          { id: 'd-ratio', type: 'multi', title: 'Volume / TVL', sub: 'capital efficiency ratio', fmt: 'ratio', grans: 'DWMQA', metrics: [{ key: 'r', label: 'Vol/TVL', num: 'aeroVol', den: 'aeroTVL', denAgg: 'avg' }], defaultGran: gran },\n          { id: 'd-base', type: 'multi', title: 'Base Market Share · Spot Volume', sub: '% of Base DEX spot volume', fmt: 'pct', metrics: [{ key: 'v', label: 'Volume Share', num: 'aeroVol', den: 'baseVol' }], defaultGran: gran },\n          { id: 'd-defi', type: 'multi', title: 'DeFi Market Share · Spot Volume', sub: '% of all DeFi DEX spot volume', fmt: 'pct', metrics: [{ key: 'v', label: 'Volume Share', num: 'aeroVol', den: 'defiVol' }], defaultGran: gran },\n          { id: 'd-fx', type: 'multi', title: 'Spot FX Volume', sub: 'Aerodrome FX pairs · USD', fmt: 'usd', metrics: [{ key: 'fx', label: 'FX Volume', num: 'spotFxVolume' }], defaultGran: gran, note: 'source: Dune query 8153828 (dune.com/queries/8153828) — daily FX-pair swap volume on Base' },\n          { id: 'd-pools', type: 'pools', cls: 'wide', title: 'Top 10 Pools by TVL' }\n        ]\n      },\n      aero: {\n        label: 'AERO', navLabel: 'AERO',\n        title: \"AERO: Aerodrome's Native Token\",\n        sub: \"AERO serves as Aerodrome's primary means of incentivization via voter emissions. To cushion the inflationary impact of these emissions, Dromos Labs allocates a portion of their weekly AERO rewards to token buybacks.\",\n        blocks: [\n          { id: 'a-px', type: 'multi', title: 'Price · Market Cap · FDV', sub: 'price on right axis', fmt: 'usd', fmtR: 'usd', grans: 'DWMQA', heavy: true, metrics: [{ key: 'mc', label: 'Market Cap', num: 'cgMcap', aggMode: 'avg' }, { key: 'fdv', label: 'FDV', num: 'fdv', aggMode: 'avg' }, { key: 'px', label: 'Price', num: 'aeroPrice', axis: 'R', aggMode: 'avg' }], defaultSel: ['mc', 'fdv', 'px'], defaultGran: gran, note: 'FDV = price × onchain total supply; market cap = price × circulating' },\n          { id: 'a-circ', type: 'multi', title: 'Circulating & Total Supply', sub: 'AERO · onchain', fmt: 'aero', grans: 'DWMQA', heavy: true, metrics: [{ key: 't', label: 'Total Supply', num: 'totalSupply', aggMode: 'avg' }, { key: 'c', label: 'Circulating', num: 'circSupply', aggMode: 'avg' }], defaultSel: ['t', 'c'], defaultGran: gran, note: 'total from Minter events; circulating = total − locked veAERO' },\n          { id: 'a-bb', type: 'multi', title: 'Buybacks', sub: 'AERO repurchased', fmt: { usd: 'usd', aero: 'aero' }, units: usdAero, metrics: [{ key: 'bb', label: 'Buybacks', num: { usd: 'buybacksUsd', aero: 'buybacksAero' } }], defaultGran: gran, emptyNote: 'add a Dune API key or paste query 4632140 export into dune-aero.js', note: 'source: Dune query 4632140 (dune.com/queries/4632140/7715260)' },\n          { id: 'a-bbt', type: 'bbsummary', title: 'Buyback Summary', sub: '$ value · AERO acquired · avg price — 7d / 30d / 180d / 365d / all', emptyNote: 'populates from buybacks (Dune 4632140) in dune-aero.js', src: 'Dune query 4632140 (dune.com/queries/4632140/7715260)' },\n          incentivesBlock('a-inc'),\n          { id: 'a-unl', type: 'multi', title: 'AERO Unlocks', sub: 'weekly emission unlocks', fmt: { usd: 'usd', aero: 'aero' }, units: usdAero, defaultUnit: 'aero', metrics: [{ key: 'u', label: 'Unlocks', num: { usd: 'incentives', aero: 'unlocks' } }], defaultGran: 'W', note: 'onchain Minter weekly emission events (Base)' },\n          { id: 'a-pie', type: 'pie', token: 'aero', title: 'Top 10 AERO Holders — Share' },\n          { id: 'a-top', type: 'holders', token: 'aero', title: 'Top 10 AERO Holders' }\n        ]\n      },\n      ve: {\n        label: 'veAERO', navLabel: 'veAERO',\n        title: \"veAERO: Aerodrome's Economic Engine\",\n        sub: \"AERO holders can lock their tokens for veAERO, which grants them the right to vote on weekly AERO emissions. Aerodrome's voter base is notoriously strong, with the lock rate (veAERO as a % of total AERO in circulation) remaining above 50% since the platform's inception.\",\n        blocks: [\n          { id: 'v-rate', type: 'multi', title: 'veAERO Lock Rate & Avg Lock Duration', sub: 'lock rate · avg duration on right axis', fmt: 'pct', fmtR: 'yrs', grans: 'DWMQA', heavy: true, metrics: [{ key: 'r', label: 'Lock Rate', num: 'lockRate', aggMode: 'avg' }, { key: 'dur', label: 'Avg Lock Duration', num: 'avgLockDuration', axis: 'R', aggMode: 'avg' }], defaultSel: ['r', 'dur'], defaultGran: gran, note: 'lock rate = VotingEscrow.supply() ÷ total supply (Base archival RPC); avg lock duration = current Dune snapshot 7391694 (shown flat — no historical series in that query)' },\n          { id: 'v-inc', type: 'multi', title: 'Voter Income & Yield', sub: 'income (holders rev + bribes) · APY on right axis', fmt: 'usd', fmtR: 'pct', grans: 'WMQA', defaultGran: 'W', heavy: true, metrics: [{ key: 'inc', label: 'Income', num: 'voterIncome' }, { key: 'apy', label: 'Voting APY', num: 'voterApy', axis: 'R', aggMode: 'avg' }], defaultSel: ['inc', 'apy'], note: 'APY = annualized income ÷ (locked veAERO × AERO price) — estimate' },\n          { id: 'v-circ', type: 'multi', title: 'Total Locked veAERO', sub: 'AERO locked over time · onchain', fmt: 'aero', grans: 'DWMQA', heavy: true, metrics: [{ key: 'l', label: 'Locked', num: 'lockedAero', aggMode: 'avg' }], defaultGran: gran, note: 'VotingEscrow.supply() sampled ~monthly (Base archival RPC)' }\n        ]\n      },\n      fin: {\n        label: 'Financials', navLabel: 'Financials',\n        title: 'Maximizing Revenue Distribution',\n        sub: \"Not only is Aerodrome among DeFi's top platforms in terms of total revenue, but its unique architecture makes it the top revenue distribution platform in all of DeFi (relative to its total revenue).\",\n        blocks: [\n          { id: 'f-key', type: 'multi', title: 'Fees · Revenue · Holders Revenue', sub: 'Aerodrome · USD', fmt: 'usd', metrics: [{ key: 'fees', label: 'Fees', num: 'aeroFees' }, { key: 'rev', label: 'Revenue', num: 'aeroRev' }, { key: 'hold', label: 'Holders Rev', num: 'aeroHold' }], defaultSel: ['fees', 'rev', 'hold'], defaultGran: gran },\n          { id: 'f-net', type: 'multi', title: 'Revenue − Incentives', sub: 'protocol revenue net of AERO-section incentives', fmt: { usd: 'usd', aero: 'aero' }, units: usdAero, grans: 'WMQAC', defaultGran: 'W', metrics: [{ key: 'n', label: 'Net', num: { usd: 'revMinusInc', aero: 'revMinusIncAero' } }], note: 'DeFiLlama revenue minus the AERO-section Incentives series (onchain Minter emissions × price)' },\n          { id: 'f-base', type: 'multi', title: 'Base Market Share', sub: '% of Base DEX spot totals', fmt: 'pct', heavy: true, metrics: shareMetrics('base').slice(1), defaultSel: ['fees', 'rev', 'hold'], defaultGran: gran },\n          { id: 'f-defi', type: 'multi', title: 'DeFi Market Share', sub: '% of all DeFi DEX spot totals', fmt: 'pct', heavy: true, metrics: shareMetrics('defi').slice(1), defaultSel: ['fees', 'rev', 'hold'], defaultGran: gran }\n        ]\n      }\n    };\n  }\n  renderVals() {\n    const theme = this.state.theme ?? (this.props.theme ?? 'mm');\n    const page = this.state.page;\n    const pages = this._pages();\n    const cur = pages[page];\n    const pageKeys = Object.keys(pages);\n    const navs = pageKeys.map((k, i) => ({\n      label: pages[k].navLabel, num: String(i + 1).padStart(2, '0'), cls: k === page ? 'on' : '',\n      go: () => { this.setState({ page: k }); this._loadKpis(k); }\n    }));\n    const pageNum = String(pageKeys.indexOf(page) + 1).padStart(2, '0');\n    const themes = [['mm', 'M&M'], ['dark', 'DARK'], ['light', 'LIGHT'], ['aero', 'AERO']].map(t => ({\n      label: t[1], cls: t[0] === theme ? 'on' : '',\n      go: () => this.setState({ theme: t[0] })\n    }));\n    const cards = this._kpiSpecs(page).map((sp, i) => ({ label: sp.label, value: this.state.kpiVals[page + ':' + i] ?? '—' }));\n    const dark = theme !== 'light';\n    const SRC = {\n      'l-tv': ['live', 'TradingView · COINBASE:AEROUSD'],\n      'l-key': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'l-inc': ['live', 'Aerodrome Minter emission events (Base) × coins.llama.fi price'],\n      'l-base': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'l-defi': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'd-vol': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'd-ratio': ['live', 'DeFiLlama dimensions + TVL APIs (api.llama.fi)'],\n      'd-base': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'd-defi': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'd-fx': ['ph', ''],\n      'd-btc': ['ph', ''],\n      'd-pools': ['live', 'DeFiLlama yields API (yields.llama.fi)'],\n      'a-px': ['mixed', 'price coins.llama.fi · circulating/total supply onchain (Base) · FDV = price × total supply'],\n      'a-circ': ['live', 'total supply from Minter events (Base) · circulating = total − onchain locked'],\n      'a-bb': ['ph', ''],\n      'a-bbt': ['ph', ''],\n      'a-inc': ['live', 'Aerodrome Minter emission events (Base) × coins.llama.fi price'],\n      'a-unl': ['live', 'Aerodrome Minter weekly emission events (Base)'],\n      'a-pie': ['live', 'Blockscout token holders API (base.blockscout.com)'],\n      'a-top': ['live', 'Blockscout token holders API (base.blockscout.com)'],\n      'v-rate': ['mixed', 'lock rate onchain (Base archival RPC + Minter events) · avg lock duration from Dune (0xkhmer/aerodrome)'],\n      'v-inc': ['mixed', 'income live from DeFiLlama (holders rev + bribes) · APY uses onchain locked supply'],\n      'v-circ': ['live', 'VotingEscrow.supply() — Base archival RPC (mainnet.base.org)'],\n      'v-hld': ['ph', ''],\n      'v-top': ['live', 'Blockscout token holders API (base.blockscout.com)'],\n      'f-key': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'f-net': ['live', 'DeFiLlama revenue − AERO-section incentives (onchain Minter × coins.llama.fi price)'],\n      'f-base': ['live', 'DeFiLlama dimensions API (api.llama.fi)'],\n      'f-defi': ['live', 'DeFiLlama dimensions API (api.llama.fi)']\n    };\n    const dune = window.__AERO_DUNE || {};\n    const hasKey = !!dune.duneApiKey;\n    const liveByKey = { 'd-fx': true, 'a-bb': true, 'a-bbt': true };\n    const cfgKey = { 'd-fx': 'spotFxVolume', 'a-bb': 'buybacks', 'a-bbt': 'buybacks' };\n    const hasCfg = id => { const k = cfgKey[id]; if (!k) return null; if (hasKey && liveByKey[id]) return true; if (k === 'buybacks') return !!(dune.buybacks && dune.buybacks.usd && dune.buybacks.usd.length); return Array.isArray(dune[k]) && dune[k].length > 0; };\n    const blocks = cur.blocks.map(b => {\n      const m = SRC[b.id] || [];\n      const cfg = hasCfg(b.id);\n      const live = cfg === null ? m[0] : (cfg ? 'live' : 'ph');\n      const src = cfg === null ? (m[1] || undefined) : (b.src || undefined);\n      return Object.assign({}, b, { cls: b.cls || '', dark, live, src });\n    });\n    return {\n      themeClass: 'thm-' + theme, navs, themes, cards, blocks, pageNum,\n      pageTitle: cur.title, pageSub: cur.sub, pageLabel: cur.navLabel\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
